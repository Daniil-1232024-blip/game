<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="true">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Образовательная игра">
    <meta name="theme-color" content="#4a90e2">
    <title>Образовательная игра для малышей</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main Menu Screen -->
    <div id="menu-screen" class="screen">
        <div class="container">
            <div class="menu-buttons-top">
                <div class="coins-badge">
                    <svg class="ui-icon coin-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="8"></circle><path d="M12 7v10M9.5 9.5c0-1 5-1 5 0s-5 1-5 2.5 5 1.5 5 2.5-5 1-5 0"></path>
                    </svg>
                    <span id="menu-coins">0</span>
                </div>
                <div class="menu-actions">
                    <button id="dailyBonusBtn" class="menu-shop-btn" aria-label="Ежедневный бонус" title="Ежедневный бонус">
                        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16v11H4zM3 6h18v3H3zM12 6v14M12 6c-4 0-6-1-6-3 0-1.5 2-2 3.5-1C11 3 12 6 12 6Zm0 0c4 0 6-1 6-3 0-1.5-2-2-3.5-1C13 3 12 6 12 6Z"></path></svg>
                    </button>
                    <button id="leaderboardBtn" class="menu-shop-btn" aria-label="Лучшие результаты" title="Лучшие результаты">
                        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v4a4 4 0 0 1-8 0V4Zm4 8v5m-4 3h8M5 5H3v2a4 4 0 0 0 4 4m12-6h2v2a4 4 0 0 1-4 4M9 20h6"></path></svg>
                    </button>
                    <button id="shopBtn" class="menu-shop-btn" aria-label="Магазин" title="Магазин">
                        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16l-1 12H5L4 8Zm3 0a5 5 0 0 1 10 0M8 12h.01M16 12h.01"></path></svg>
                    </button>
                </div>
            </div>
            <h1>Образовательная игра</h1>
            <div class="menu-content">
                <!-- Step 1: Choose Subject -->
                <div id="step-subject">
                    <label>Выберите предмет:</label>
                    <div class="button-group" id="subject-buttons">
                        <button class="option-btn active" data-value="math">
                            <span class="icon">🔢</span>
                            <span class="text">Математика</span>
                        </button>
                        <button class="option-btn" data-value="russian">
                            <span class="icon">🔠</span>
                            <span class="text">Русский язык</span>
                        </button>
                    </div>
                </div>

                 <!-- Step 2: Math Options -->
                 <div id="step-math" style="display:none;">
                     <label>Режим:</label>
                     <div class="button-group" id="mode-buttons">
                         <button class="option-btn" data-value="sticks">
                             <span class="icon">🔢</span>
                             <span class="text">Счётные палочки</span>
                         </button>
                         <button class="option-btn active" data-value="examples">
                             <span class="icon">➕</span>
                             <span class="text">Примеры</span>
                         </button>
                     </div>
                     <select id="modeSelect" style="display:none;">
                         <option value="sticks">Счётные палочки</option>
                         <option value="examples" selected>Примеры</option>
                     </select>

                     <button id="backToSubject" class="back-step-btn">← Назад</button>
                 </div>

                <!-- Step 2: Russian Options -->
                <div id="step-russian" style="display:none;">
                    <label>Режим русского:</label>
<div class="button-group" id="ru-mode-buttons">
                         <button class="option-btn" data-value="letters">
                             <span class="icon">✏️</span>
                             <span class="text">Списать буквы</span>
                         </button>
                         <button class="option-btn active" data-value="words">
                             <span class="icon">📝</span>
                             <span class="text">Пропущенное</span>
                         </button>
                         <button class="option-btn" data-value="copy">
                             <span class="icon">📋</span>
                             <span class="text">Списать слово</span>
                         </button>
                         <button class="option-btn" data-value="type">
                             <span class="icon">⌨️</span>
                             <span class="text">Написать букву</span>
                         </button>
                     </div>
<select id="ruModeSelect" style="display:none;">
                         <option value="letters">Буквы</option>
                         <option value="words">Пропущенное</option>
                         <option value="copy">Слова</option>
                         <option value="type">Написать букву</option>
                     </select>

                    <button id="backToSubjectFromRu" class="back-step-btn">← Назад</button>
                </div>

                <!-- Hidden selects for state management -->
                <select id="gameSelect" style="display:none;">
                    <option value="math">Математика</option>
                    <option value="russian">Русский язык</option>
                </select>
                <select id="opSelect" style="display:none;">
                    <option value="add" selected>Сложение</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen" style="display:none;">
        <div class="container">
            <div class="game-header">
                <button id="backBtn" class="back-button">← Меню</button>
                <h1>Игра</h1>
            </div>
            <div id="game">
                <div id="question"></div>
                <div id="sticks-container" style="display:none; text-align:center; margin:20px 0;"></div>
                <div id="russian-input-area" style="display:none; margin:20px 0;">
                    <canvas id="letterCanvas" width="300" height="300" style="width:100%; max-width:300px; aspect-ratio:1; border:3px solid #4a90e2; border-radius:15px; cursor:crosshair; display:none; touch-action:none; background:white;"></canvas>
                    <input type="text" id="russianTextInput" placeholder="Введите букву или слово" maxlength="50" style="padding:15px; font-size:1.5rem; border:3px solid #4a90e2; border-radius:15px; width:100%; text-align:center; display:none; touch-action:manipulation;">
                    <div id="word-with-gap" style="font-size:2rem; margin:20px 0; letter-spacing:5px;"></div>
                </div>
                <div id="options"></div>
                <div id="feedback"></div>
                <div id="score">Счёт: 0</div>
                <div id="timer">Время: 10</div>
                <button id="nextBtn" style="display:none;">Следующий вопрос</button>
            </div>
            <div id="confetti-container"></div>
        </div>
        <div id="stars"></div>
    </div>

    <!-- Shop Screen -->
    <div id="shop-screen" class="screen" style="display:none;">
        <div class="container">
            <div class="shop-header">
                <h1>🛍️ Магазин</h1>
                <button id="closeShopBtn" class="close-shop-btn">✕</button>
            </div>
            <div class="coins-display">
                💰 Монеты: <span id="coins-count">0</span>
            </div>
            <div id="shop-items"></div>
        </div>
    </div>

    <div id="color-picker-container" role="dialog" aria-label="Выбор цвета фона">
        <h2>Выберите цвет фона</h2>
        <div id="colorPicker" class="color-picker"></div>
    </div>

    <script src="script.js"></script>
    <script src="leaderboard.js"></script>
    <script src="daily-bonus.js"></script>
</body>
</html>
